# git-cliff configuration, see https://git-cliff.org/docs/configuration
# Changelog follows the Conventional Commits specification, grouped by type
# and styled after the keep-a-changelog layout.
# The config works fully offline: set GITHUB_REPO + GITHUB_TOKEN env vars to
# additionally enrich commits with pull request metadata.

[changelog]
# Template rendered for each release
body = """
## [{% if version %}{{ version | trim_start_matches(pat="v") }}{% else %}Unreleased{% endif %}]\
  {% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% if version %}\
  {% if previous %}{% if previous.commit_id %}\
    [compare: {{ previous.commit_id | truncate(length=7, end="") }}...{{ commit_id | truncate(length=7, end="") }}]\
    (https://github.com/elcoosp/readma/compare/{{ previous.commit_id }}...{{ commit_id }})
  {% endif %}{% endif %}\
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/elcoosp/readma/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
# Remove leading and trailing spaces from the body
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse commits according to conventional commits
conventional_commits = true
# Exclude commits that do not parse
filter_unconventional = true
# Split commits on newlines for the body processing
split_commits = false
# Protect breaking changes from being skipped
protect_breaking_commits = true
# Group commits by their conventional type
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(scope\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
  { message = ".*", group = "Other" },
]
# Filter out skipped commits
filter_commits = true
# Match release tags: v prefixed and legacy bare semver tags
tag_pattern = "^v?[0-9]+\\.[0-9]+\\.[0-9]+"
# Sort commits inside a release
sort_commits = "oldest"
