name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: deno fmt --check

      - name: Deno lint
        run: deno lint

      - name: Oxlint (pedantic)
        run: pnpm exec oxlint --deny-warnings

      - name: Type check
        run: deno check packages/core/src/mod.ts packages/cli/src/mod.ts packages/pkg-json/src/mod.ts scripts/pre-version.ts

      - name: Test with coverage
        run: deno test -A --coverage=cov

      - name: Coverage summary
        run: deno coverage cov

      - name: Validate the readma config
        run: deno run -A packages/cli/src/mod.ts validate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: cov/lcov.info
          fail_ci_if_error: false

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check documentation
        run: pnpm --filter @readma/documentation check

      - name: Build documentation
        run: pnpm --filter @readma/documentation build
