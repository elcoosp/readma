# Lefthook local git hooks, install with `pnpm exec lefthook install`
pre-commit:
  commands:
    fmt:
      glob: '*.{ts,tsx,js,jsx,json,jsonc,md,yml,yaml,toml}'
      run: deno fmt {staged_files}
      stage_fixed: true
    deno-lint:
      glob: '*.{ts,tsx,js,jsx}'
      run: deno lint {staged_files}
    oxlint:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm exec oxlint {staged_files} --deny-warnings

pre-push:
  commands:
    check:
      run: deno check packages/core/src/mod.ts packages/cli/src/mod.ts packages/pkg-json/src/mod.ts
    test:
      run: deno test -A
